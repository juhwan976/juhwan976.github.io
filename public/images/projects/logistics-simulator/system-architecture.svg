  <text x="2010" y="105" text-anchor="end" font-size="26" fill="#9aa0a8">Electron · React · Three.js</text>
  <rect x="90" y="170" width="560" height="640" rx="16" fill="#15171a" stroke="#26292e" stroke-width="2"/>
