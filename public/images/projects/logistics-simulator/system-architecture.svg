  <text x="160" y="665" font-size="26" font-weight="600" fill="#eceae5">Recording Encoder</text>
  <text x="160" y="708" font-size="23" fill="#9aa0a8">화면 녹화 → MP4 인코딩</text>
  <rect x="770" y="400" width="200" height="180" rx="12" fill="#15171a" stroke="#3a3e45" stroke-width="2"/>
