  <text x="1600" y="391" font-size="23" fill="#9aa0a8">도면 · 도로망 에디터</text>
  <text x="1600" y="428" font-size="23" fill="#9aa0a8">AGV 운행 재생</text>
  <rect x="1140" y="530" width="400" height="210" rx="10" fill="#0e0f11" stroke="#26292e" stroke-width="2"/>
  <text x="1170" y="588" font-size="26" font-weight="600" fill="#eceae5">Redux Store</text>
  <text x="1170" y="631" font-size="23" fill="#9aa0a8">문서 상태 — 저장 · 실행 취소</text>
  <text x="1170" y="668" font-size="23" fill="#9aa0a8">런타임 상태는 밖에 둔다</text>
  <rect x="1570" y="530" width="400" height="210" rx="10" fill="#0e0f11" stroke="#ff5c1f" stroke-width="2"/>
  <text x="1600" y="588" font-size="26" font-weight="600" fill="#eceae5">Simulation Engine</text>
  <text x="1600" y="631" font-size="23" fill="#9aa0a8">Web Worker — 전 구간 1회 계산</text>
  <text x="1600" y="668" font-size="23" fill="#ff5c1f">결정론적 · 재생은 조회만</text>
  <line x1="1540" y1="395" x2="1562" y2="395" stroke="#686d74" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1340" y1="500" x2="1340" y2="522" stroke="#686d74" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1770" y1="522" x2="1770" y2="500" stroke="#ff5c1f" stroke-width="3" marker-end="url(#arrowAccent)"/>
