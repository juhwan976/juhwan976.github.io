  <line x1="978" y1="460" x2="1092" y2="460" stroke="#686d74" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1100" y1="524" x2="986" y2="524" stroke="#686d74" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="770" y1="524" x2="658" y2="524" stroke="#686d74" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="870" y="368" text-anchor="middle" font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="20" letter-spacing="3" fill="#686d74">IPC · RESULT PATTERN</text>
  <rect x="1100" y="170" width="910" height="640" rx="16" fill="#15171a" stroke="#26292e" stroke-width="2"/>
  <text x="1140" y="238" font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="24" letter-spacing="4" fill="#eceae5">RENDERER PROCESS</text>
