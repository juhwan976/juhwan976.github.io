  <text x="884" y="806" font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="20" fill="#ff5c1f">Tc</text>
  <text x="80" y="920" font-size="24" fill="#686d74">동일한 입력은 항상 동일한 결과를 재현한다 — 시뮬레이션 결과를 신뢰할 수 있는 이유.</text>
