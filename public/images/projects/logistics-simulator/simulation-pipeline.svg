  <text x="492" y="446" font-size="22" fill="#9aa0a8">고정 타임스텝 · 결정론</text>
  <line x1="770" y1="340" x2="832" y2="340" stroke="#686d74" stroke-width="3" marker-end="url(#arrow)"/>
